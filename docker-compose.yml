name: dipasha

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dipasha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dipasha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dipasha} -d ${POSTGRES_DB:-dipasha}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bound to loopback only — Postgres is never exposed to the public
      # internet (Section 12B.5's actual requirement), which a 127.0.0.1
      # bind already satisfies regardless of host. Originally commented
      # "remove entirely on a real VPS," from before M16 existed —
      # revised: scripts/backup.sh (M16.2) needs a host-level cron job to
      # reach Postgres directly, and a loopback bind is exactly as safe
      # as the SSH-tunnel/private-network access Section 12B.5 asks for,
      # since nothing outside the VPS itself can ever reach it. Keep this
      # on every host, including production.
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dipasha}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dipasha}
      # Set by deploy.sh to the git commit SHA on every deploy (Section
      # 12B.4) — falls back to "dev" for `docker compose up` run by hand.
      RELEASE_VERSION: ${RELEASE_VERSION:-dev}
    volumes:
      # Write-off photo evidence (Section 9) — local disk for this single-
      # VPS pilot, not object storage (see DECISIONS.md). Named volume so
      # photos survive a container recreate/redeploy.
      - uploads:/repo/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_RELEASE_VERSION: ${RELEASE_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  # Reverse proxy with automatic Let's Encrypt TLS. Not needed for local
  # dev (hit the api/web containers directly on :3000/:8080). Bring it up
  # with:
  #   docker compose --profile proxy up -d
  # once DOMAIN in .env points at this host's public IP (Section 12B.1).
  # Caddy splits the one subdomain by path: /api/* to the api container,
  # everything else to the web console's static build.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. app.dipashamedicalstore.in}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
