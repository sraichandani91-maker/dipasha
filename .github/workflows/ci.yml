name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t dipasha-api:ci .

      - name: Smoke test container starts and /health responds
        run: |
          docker run -d --name dipasha-api-ci -p 3000:3000 \
            -e NODE_ENV=production -e PORT=3000 dipasha-api:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          echo "api did not become healthy in time"
          docker logs dipasha-api-ci
          exit 1
